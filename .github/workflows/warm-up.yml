name: warm-up

# Warm-up before a demo (plan section 9.6): starts the VMs, resumes or recreates T3, sets the activity profile,
# lets it run, then checks that telemetry arrives, so Hub charts have history when the presenter joins.
# schedule-start.yml runs the same on a schedule. Run it about 45 minutes before the session.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment
        type: string
        required: true
        default: demo
      minutes:
        description: Minutes of activity before the telemetry check (at least 30 for useful charts)
        type: string
        default: "30"
      profile:
        description: Activity profile (empty for the configured activityProfile)
        type: string
        default: ""

# Least privilege (ADR 0022): only the job that signs in to Azure may request an OpenID Connect token.
permissions:
  contents: read

jobs:
  warm-up:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-demo-run.yml
    with:
      environment: ${{ inputs.environment }}
      script: start-demo
      parameters: >-
        {"WarmUpMinutes": ${{ toJSON(inputs.minutes) }}, "WaitForWarmUp": true, "ActivityProfile": ${{ toJSON(inputs.profile) }}}
      bicep: true
      timeout-minutes: 300
    secrets: inherit
