# Database Hub Insights (preview): the Fabric App's backend configuration (Rayfin CLI 1.36.2).
# Git holds placeholders only. scripts/configure-fabric-app.ps1 deploys from a Git-ignored copy under out/fabric-app
# and writes rayfin/.env there with DBHUB_FABRIC_WORKSPACE_ID and DBHUB_SEMANTIC_MODEL_ID, which ${...} interpolation
# reads (https://learn.microsoft.com/fabric/apps/project-structure). `rayfin up` then adds the hosting origin to
# allowedRedirectUris in that copy, never here.
id: dbhub-insights
name: Database Hub Insights
version: 0.1.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
  data:
    enabled: false
  storage:
    enabled: false
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build
    indexDocument: index.html
    # Sign-in and permission on the app item before any asset is served (https://learn.microsoft.com/fabric/apps/hosting).
    assetAccess: protected
  functions:
    enabled: false
connectors:
  # Read-only: the semantic model connector allows executeQuery only, with delegated (signed-in user) access
  # (https://learn.microsoft.com/fabric/apps/connectors). schema.ts under connectors/history was generated by
  # `rayfin connector add` and holds no IDs.
  - name: history
    type: fabric-semanticmodel
    config:
      workspaceId: ${DBHUB_FABRIC_WORKSPACE_ID}
      itemId: ${DBHUB_SEMANTIC_MODEL_ID}
    auth:
      type: delegated
    version: "1"
    operations:
      - name: executeQuery
